services:
  # =============================================================
  # MySQL 8.0 Database (Multi-platform Native: ARM64 & AMD64)
  # =============================================================
  mysql:
    image: mysql:8.0
    container_name: location_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-12345678}"
      MYSQL_DATABASE: "${DB_NAME:-location_weather_db}"
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-12345678}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # =============================================================
  # Java Web Application (Tomcat 10.1 + Servlet/JSP)
  # =============================================================
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: location_webapp
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:-location_weather_db}"
      DB_USER: "${DB_USER:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-12345678}"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
